  {n:4,level:1,title:"Temperature Converter",sub:"Math with variables, f-strings",tags:["float","math ops","f-strings","input()"],

  {n:6,level:2,title:"Even or Odd",sub:"if / else and the modulo operator",tags:["if/else","%","int()"],

else:

  {n:7,level:2,title:"Grade Classifier",sub:"if / elif / else chains",tags:["if/elif/else","comparison ops","int()"],

if score >= 90:

elif score >= 80:

elif score >= 70:
    grade = "C"
elif score >= 60:

else:

print(f"Score: {score}  →  Grade: {grade}")`},

  {n:8,level:2,title:"Password Checker",sub:"String comparison, boolean logic",tags:["if/else","and","str comparison"],

username = input("Enter username: ")
password = input("Enter password: ")

if username == "student" and password == SECRET:
    print("Access granted! Welcome.")
else:

  {n:9,level:2,title:"Movie Ticket Pricer",sub:"Compound conditions, age logic",tags:["if/elif/else","and","or","int()"],
   note:"Real-world context lands well. Ask students to draw a flowchart of this logic before coding.",
   code:`age = int(input("Enter your age: "))
is_member = input("Are you a member? (yes/no): ").lower()

if age < 5:

elif age <= 12 or age >= 65:

else:

print(f"Your ticket price: ${price:.2f}")`},

  {n:10,level:2,title:"FizzBuzz",sub:"Classic logic challenge",tags:["if/elif/else","%","range()","for"],
   note:"A classic interview problem. Have students predict the output for 15 before running it. Discuss why FizzBuzz must come first.",
   code:`for num in range(1, 31):
    if num % 15 == 0:
        print("FizzBuzz")
    elif num % 3 == 0:
        print("Fizz")
    elif num % 5 == 0:
        print("Buzz")

  {n:11,level:3,title:"Countdown Timer",sub:"while loop, decrement",tags:["while","decrement"],
   note:"The most visual while loop intro. Ask: when does it stop? What changes the condition each time?",
   code:`countdown = 10

while countdown > 0:
    print(f"T-minus {countdown}...")
    countdown -= 1

print("Liftoff! 🚀")`},

  {n:12,level:3,title:"Sum Accumulator",sub:"while loop, running total",tags:["while","accumulator pattern","int()"],

   code:`total = 0
count = 0

print("Enter numbers to add. Type 0 to stop.")

num = int(input("Enter a number: "))
while num != 0:
    total += num
    count += 1
    num = int(input("Enter a number: "))

if count > 0:

else:

  {n:13,level:3,title:"Multiplication Table",sub:"for loop with range()",tags:["for","range()","f-strings"],
   note:"Students can customize with their own number. Discuss why range() is exclusive of the stop value.",
   code:`num = int(input("Which multiplication table? "))

print(f"\n--- {num} Times Table ---")
for i in range(1, 13):
    print(f"  {num} x {i:2} = {num * i}")`},

  {n:14,level:3,title:"Star Pattern Printer",sub:"Nested for loops",tags:["nested loops","for","range()"],
   note:"Nested loops are hard. Walk through the outer loop (rows) and inner loop (columns) separately before combining.",
   code:`rows = int(input("How many rows? "))

print("\nTriangle:")
for i in range(1, rows + 1):
    print("*" * i)

print("\nSquare:")
for i in range(rows):
    print("*" * rows)

print("\nDiamond top:")
for i in range(1, rows + 1):
    print(" " * (rows - i) + "*" * (2 * i - 1))`},

  {n:15,level:3,title:"Number Guessing Game",sub:"while loop, random, game loop",tags:["while","random","import","break"],
   note:"First use of import. The game loop pattern (play until win) is a big CS concept. Count attempts with an accumulator.",
   code:`import random

secret = random.randint(1, 100)
attempts = 0
guessed = False

print("I'm thinking of a number between 1 and 100.")

while not guessed:
    guess = int(input("Your guess: "))
    attempts += 1

    if guess < secret:
        print("Too low! Try higher.")
    elif guess > secret:
        print("Too high! Try lower.")
    else:
        guessed = True

print(f"You got it in {attempts} attempts! The number was {secret}.")`},

  {n:16,level:4,title:"Greeting Function",sub:"def, calling functions",tags:["def","function call","parameters"],
   note:"The jump from writing code to wrapping it in a function is big. Emphasize: define once, call many times.",
   code:`def greet(name):
    print(f"Hello, {name}! Welcome to Python.")
    print(f"Have a great day, {name}!\n")

greet("Alex")
greet("Jordan")
greet("Sam")`},

  {n:17,level:4,title:"Calculator Functions",sub:"Parameters, return values",tags:["def","return","parameters"],
   note:"Return is the hardest function concept. Show that return sends a value back — printing inside a function is different.",
   code:`def add(a, b):
    return a + b

def subtract(a, b):
    return a - b

def multiply(a, b):
    return a * b

def divide(a, b):
    if b == 0:
        return "Error: division by zero"
    return a / b

x = float(input("First number: "))
y = float(input("Second number: "))

print(f"Add:      {add(x, y)}")
print(f"Subtract: {subtract(x, y)}")
print(f"Multiply: {multiply(x, y)}")
print(f"Divide:   {divide(x, y):.2f}")`},

  {n:18,level:4,title:"Shape Area Calculator",sub:"Multiple functions, math module",tags:["def","return","import math","parameters"],
   note:"Students can add their own shapes. math.pi is a great intro to modules containing constants, not just functions.",
   code:`import math

def circle_area(radius):
    return math.pi * radius ** 2

def rectangle_area(length, width):
    return length * width

def triangle_area(base, height):
    return 0.5 * base * height

shape = input("Shape (circle/rectangle/triangle): ").lower()

if shape == "circle":
    r = float(input("Radius: "))
    print(f"Area = {circle_area(r):.2f}")
elif shape == "rectangle":
    l = float(input("Length: "))
    w = float(input("Width: "))
    print(f"Area = {rectangle_area(l, w):.2f}")
elif shape == "triangle":
    b = float(input("Base: "))
    h = float(input("Height: "))
    print(f"Area = {triangle_area(b, h):.2f}")
else:
    print("Unknown shape.")`},

  {n:19,level:4,title:"Is Prime?",sub:"Functions with logic, boolean return",tags:["def","return bool","for","if"],
   note:"Good opportunity to discuss why we only check up to the square root. Returns True/False — a boolean-return function.",
   code:`def is_prime(n):
    if n < 2:
        return False
    for i in range(2, int(n ** 0.5) + 1):
        if n % i == 0:
            return False
    return True

num = int(input("Enter a number: "))

if is_prime(num):
    print(f"{num} is a prime number.")
else:
    print(f"{num} is not a prime number.")

print("\nPrime numbers up to 50:")
primes = [n for n in range(2, 51) if is_prime(n)]
print(primes)`},

  {n:20,level:4,title:"Recursive Countdown",sub:"Intro to recursion",tags:["recursion","def","base case"],
   note:"Draw the call stack on the board. Base case first, always. Compare side-by-side with the while loop version.",
   code:`def countdown(n):
    if n <= 0:
        print("Blastoff!")
        return
    print(n)
    countdown(n - 1)

def factorial(n):
    if n == 0 or n == 1:
        return 1
    return n * factorial(n - 1)

countdown(5)

num = int(input("\nFactorial of: "))
print(f"{num}! = {factorial(num)}")`},

  {n:21,level:5,title:"Shopping List Manager",sub:"Lists, append, remove, iteration",tags:["list","append()","remove()","for","len()"],
   note:"First real list program. Walk through index positions. Show that lists are ordered and mutable.",
   code:`shopping_list = []

print("Shopping List Manager")
print("Commands: add, remove, show, quit\n")

while True:
    command = input("Command: ").lower()

    if command == "add":
        item = input("Item to add: ")
        shopping_list.append(item)
        print(f"Added '{item}'.")
    elif command == "remove":
        item = input("Item to remove: ")
        if item in shopping_list:
            shopping_list.remove(item)
            print(f"Removed '{item}'.")
        else:

    elif command == "show":
        if not shopping_list:
            print("Your list is empty.")

    elif command == "quit":

        break
    else:
        print("Unknown command.")`},

  {n:22,level:5,title:"High Score Tracker",sub:"Lists, sort, max, min, slicing",tags:["list","sort()","max()","min()","slicing"],
   note:"Shows built-in list functions. Sorted() vs .sort() distinction is worth a class discussion.",
   code:`scores = []

print("Enter scores (type 'done' when finished):")

while True:
    entry = input("Score: ")
    if entry.lower() == "done":
        break
    try:
        scores.append(int(entry))

if scores:
    scores.sort(reverse=True)
    print(f"\n--- Score Report ---")
    print(f"Scores:   {scores}")
    print(f"Highest:  {scores[0]}")
    print(f"Lowest:   {scores[-1]}")
    print(f"Average:  {sum(scores)/len(scores):.1f}")

  {n:23,level:5,title:"String Analyzer",sub:"String methods, looping characters",tags:["str methods","for","len()","count()"],
   note:"Strings as sequences is key. Show that a string is really a list of characters — index, slice, iterate.",
   code:`text = input("Enter a sentence: ")

vowels = "aeiouAEIOU"
vowel_count = 0
consonant_count = 0

for char in text:
    if char.isalpha():
        if char in vowels:
            vowel_count += 1
        else:
            consonant_count += 1

print(f"\n--- String Analysis ---")
print(f"Original:    {text}")
print(f"Uppercase:   {text.upper()}")
print(f"Reversed:    {text[::-1]}")
print(f"Word count:  {len(word_list)}")
print(f"Char count:  {len(text)}")
print(f"Vowels:      {vowel_count}")
print(f"Consonants:  {consonant_count}")`},

  {n:24,level:5,title:"Caesar Cipher",sub:"ord(), chr(), string building",tags:["ord()","chr()","str","for","modulo"],
   note:"Connects to history (Julius Caesar). ord() and chr() bridge strings to numbers — great discussion of ASCII.",
   code:`def encrypt(message, shift):
    result = ""
    for char in message:
        if char.isalpha():
            base = ord('A') if char.isupper() else ord('a')
            result += chr((ord(char) - base + shift) % 26 + base)
        else:
            result += char
    return result

def decrypt(message, shift):
    return encrypt(message, -shift)

message = input("Enter message: ")
shift = int(input("Shift amount (1-25): "))

encrypted = encrypt(message, shift)
decrypted = decrypt(encrypted, shift)

print(f"\nOriginal:  {message}")
print(f"Encrypted: {encrypted}")
print(f"Decrypted: {decrypted}")`},

  {n:25,level:6,title:"Contact Book",sub:"Dictionaries, key-value pairs",tags:["dict","keys()","values()","in"],
   note:"A dictionary is the perfect data structure for contacts. Key:value is the core vocabulary to establish here.",
   code:`contacts = {}

print("Contact Book — commands: add, lookup, list, delete, quit\n")

while True:
    cmd = input("Command: ").lower()

    if cmd == "add":
        name = input("Name: ")
        phone = input("Phone: ")
        contacts[name] = phone
        print(f"Added {name}.")
    elif cmd == "lookup":
        name = input("Name to look up: ")
        if name in contacts:
            print(f"{name}: {contacts[name]}")
        else:
            print(f"{name} not found.")
    elif cmd == "list":
        if contacts:
            for name, phone in contacts.items():
                print(f"  {name}: {phone}")
        else:
            print("No contacts yet.")
    elif cmd == "delete":
        name = input("Name to delete: ")
        if name in contacts:
            del contacts[name]
            print(f"Deleted {name}.")
        else:
            print("Not found.")
    elif cmd == "quit":
        break`},

  {n:26,level:6,title:"Word Frequency Counter",sub:"Dictionaries as counters",tags:["dict","split()","get()","sorted()"],
   note:"Building a counter dictionary is a key algorithmic pattern. .get() with a default is a must-teach method.",
   code:`text = input("Enter a sentence or paragraph:\n")

words = text.lower().split()
frequency = {}

for word in words:
    word = word.strip(".,!?;:")
    frequency[word] = frequency.get(word, 0) + 1

sorted_words = sorted(frequency.items(), key=lambda x: x[1], reverse=True)

print(f"\n--- Word Frequency ---")
print(f"Total words: {len(words)}")
print(f"Unique words: {len(frequency)}\n")
print("Word          Count")
print("-" * 22)
for word, count in sorted_words:
    bar = "█" * count
    print(f"{word:<14} {count}  {bar}")`},

  {n:27,level:6,title:"Student Grade Book",sub:"Nested dictionaries",tags:["nested dict","for","sum()","f-strings"],
   note:"Nested data structures unlock real-world modeling. Draw it as a table: students are rows, subjects are columns.",
   code:`gradebook = {
    "Alex": {"Math": 92, "Science": 88, "English": 95},
    "Jordan": {"Math": 78, "Science": 84, "English": 71},
    "Sam": {"Math": 95, "Science": 97, "English": 89},
}

print(f"{'Name':<10} {'Math':>6} {'Science':>8} {'English':>8} {'Average':>8}")
print("-" * 44)

for student, grades in gradebook.items():
    avg = sum(grades.values()) / len(grades)
    print(f"{student:<10} {grades['Math']:>6} {grades['Science']:>8} {grades['English']:>8} {avg:>7.1f}")

print("\nClass averages by subject:")
subjects = ["Math", "Science", "English"]
for subject in subjects:
    avg = sum(gradebook[s][subject] for s in gradebook) / len(gradebook)
    print(f"  {subject}: {avg:.1f}")`},

  {n:28,level:7,title:"Animal Class",sub:"class, __init__, methods",tags:["class","__init__","self","methods"],
   note:"The jump to OOP. __init__ is the constructor — build the analogy: a class is a blueprint, an object is the house.",
   code:`class Animal:
    def __init__(self, name, species, sound):
        self.name = name
        self.species = species
        self.sound = sound

    def speak(self):
        print(f"{self.name} says {self.sound}!")

    def describe(self):
        print(f"{self.name} is a {self.species}.")

dog = Animal("Rex", "dog", "woof")
cat = Animal("Luna", "cat", "meow")
cow = Animal("Bessie", "cow", "moo")

dog.speak()
cat.speak()
cow.speak()
dog.describe()

animals = [dog, cat, cow]
print("\nAll animals:")
for a in animals:
    print(f"  {a.name} ({a.species})")`},

  {n:29,level:7,title:"Bank Account",sub:"Class with state, multiple methods",tags:["class","__init__","methods","self"],
   note:"Attributes that change over time (balance) show why objects are powerful. Encapsulation vocabulary fits naturally here.",
   code:`class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance
        self.transactions = []

    def deposit(self, amount):
        if amount > 0:
            self.balance += amount
            self.transactions.append(f"+ ${amount:.2f}")
            print(f"Deposited ${amount:.2f}. Balance: ${self.balance:.2f}")
        else:
            print("Deposit must be positive.")

    def withdraw(self, amount):
        if amount > self.balance:
            print("Insufficient funds.")
        elif amount <= 0:
            print("Amount must be positive.")
        else:
            self.balance -= amount
            self.transactions.append(f"- ${amount:.2f}")
            print(f"Withdrew ${amount:.2f}. Balance: ${self.balance:.2f}")

    def show_statement(self):
        print(f"\n--- {self.owner}'s Account ---")
        for t in self.transactions:
            print(f"  {t}")
        print(f"  Balance: ${self.balance:.2f}")

account = BankAccount("Alex", 100.00)
account.deposit(50)
account.withdraw(30)
account.withdraw(200)

   code:`import random

class Character:
    def __init__(self, name, health, attack, defense):
        self.name = name
        self.health = health
        self.max_health = health
        self.attack = attack
        self.defense = defense

    def is_alive(self):
        return self.health > 0

    def take_damage(self, damage):
        actual = max(0, damage - self.defense)
        self.health = max(0, self.health - actual)
        return actual

    def attack_target(self, target):
        damage = random.randint(self.attack - 3, self.attack + 5)
        taken = target.take_damage(damage)
        print(f"  {self.name} hits {target.name} for {taken} damage! "
              f"({target.health}/{target.max_health} HP left)")

    def status(self):
        bar = "█" * (self.health // 5) + "░" * ((self.max_health - self.health) // 5)
        return f"{self.name}: [{bar}] {self.health}/{self.max_health}"

hero   = Character("Hero",   100, 15, 5)
dragon = Character("Dragon", 120, 18, 8)

print("⚔️  BATTLE START ⚔️\n")
round_num = 1

    hero.attack_target(dragon)
    if dragon.is_alive():

    round_num += 1

winner = hero if hero.is_alive() else dragon

let activeLevel = 0;
let searchTerm = "";

function renderFilters(){
  const f=document.getElementById("filters");
  f.innerHTML='';
  const allBtn=document.createElement("button");
  allBtn.className="pill"+(activeLevel===0?" active":"");
  allBtn.textContent="All";
  allBtn.onclick=()=>{activeLevel=0;render()};
  f.appendChild(allBtn);
  LEVELS.forEach(l=>{
    const b=document.createElement("button");
    b.className="pill"+(activeLevel===l.id?" active":"");
    b.textContent=l.short;
    b.onclick=()=>{activeLevel=l.id;render()};
    f.appendChild(b);
  });
}

function filtered(){
  return PROGRAMS.filter(p=>{
    const matchLevel=activeLevel===0||p.level===activeLevel;
    const q=searchTerm.toLowerCase();
    const matchSearch=!q||p.title.toLowerCase().includes(q)||p.sub.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q))||p.note.toLowerCase().includes(q)||p.code.toLowerCase().includes(q);
    return matchLevel&&matchSearch;
  });
}

function render(){
  renderFilters();
  const list=document.getElementById("list");
  const progs=filtered();
  document.getElementById("stats").textContent=`Showing ${progs.length} of ${PROGRAMS.length} programs`;
  list.innerHTML="";
  if(!progs.length){list.innerHTML='<div class="no-results">No programs match your search.</div>';return;}
  progs.forEach(p=>{
    const card=document.createElement("div");
    card.className="prog-card";
    const levelObj=LEVELS.find(l=>l.id===p.level);
    card.innerHTML=`
      <div class="prog-header" onclick="toggle(this)">
        <div class="prog-num">${p.n}</div>
        <div class="prog-header-text">
          <div class="prog-title">${p.title}</div>
          <div class="prog-sub">${p.sub}</div>
        </div>
        <span class="prog-badge badge-${p.level}">${levelObj.short}</span>
        <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      </div>
      <div class="prog-body">
        <div class="note-bar"><strong>Teacher note:</strong> ${p.note}</div>
        <div class="concept-tags">${p.tags.map(t=>`<span class="ctag">${t}</span>`).join("")}</div>
        <div class="code-block">
          <button class="copy-btn" onclick="copyCode(this)"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>
          <pre><code>${escHtml(p.code)}</code></pre>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

function toggle(header){
  const body=header.nextElementSibling;
  const chev=header.querySelector(".chevron");
  const isOpen=body.classList.contains("show");
  body.classList.toggle("show",!isOpen);
  chev.classList.toggle("open",!isOpen);
}

function copyCode(btn){
  const code=btn.nextElementSibling.querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> Copied!';
    setTimeout(()=>{btn.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i> Copy';},1800);
  });
}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value;render();});
render();
</script>
